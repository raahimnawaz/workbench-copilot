# SO-101 kinematic chain, read from TheRobotStudio's URDF (vendored unchanged in hardware/, Apache-2.0).
urdf: hardware/so101_new_calib.urdf
base_link: base_link
tip_link: gripper_frame_link          # the point between the jaws
joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]

# In the URDF the gripper's approach direction is its z-axis. Turning the tool frame -90° about y
# makes approach the x-axis, which is what kinematics.task_to_pose expects. xyz moves the tool point from the URDF's
# point between the jaws to the closed jaws' tips, by the four-touch test (Oct 29, 22:34, arm-bench/tip_offset.py
# --roll): one dot touched straight down over 255° of wrist roll read 11.6 mm rms apart with the URDF's point and 4.9
# with this, which puts the tips 3.7 mm from the roll's axis instead of 7.9. Along the gripper it stays 0, as the 20:35
# tilt test found (-3 mm).
tool:
  xyz: [-0.0099, 0.0033, 0]
  rpy: [0, -1.5708, 0]

# The table under the arm (wbc/motion/table.py): the driver's floors are measured from it. The desk sits about 15 mm
# under the URDF's z 0 near the base, which stands about 0.6 in tall, and reads lower the further out the arm reaches,
# most likely its joints' zeros. Touched with the arm (Oct 29, 23:05: desk tags 21-25, 95-399 mm from the base's pan
# axis, at bearings -92° to +27°) it's -8.7 mm at the pan axis falling 88.9 mm per m of reach, every tag within 1.3 mm.
# The floors add a 2 mm margin. Nearer or further out than the touches, the table is the higher of the line and its
# nearest touched end, and past their bearings it rises over 10° to the highest the line reached, never lower; a pick
# is refused where it's held more than 2 mm high. scripts/desk_camera.py table prints these lines again after a
# re-touch.
table:
  at_base_mm: -8.7
  slope_mm_per_m: -88.9
  reach_mm: [94, 399]
  margin_mm: 2.0
  axis_mm: [38.8353, 0.0]
  bearing_deg: [-92, 27]

# How close the tool point, the jaw tips, may come to that table, mm. The driver's default is 10, and 5 the least it
# takes: the arm sagging 5 mm under a floor cuts every motor. 5 lets a pick put the tips about halfway up a 16 mm handle
# lying 13-20 cm out, 6 mm over that cut, so a pick reads how far the arm sags just over the handle first and stops
# there if going down would leave under 1 mm of it. The elbow and wrist axes keep their 30 mm.
tool_floor_mm: 5

# The arm's servo adapter, for python -m wbc.agent --arm, and lerobot-calibrate's folder when it's another macOS
# account's (empty: this account's own).
port: /dev/cu.usbmodem5B910297421
calibration_dir:

# Picking things up and putting them down (wbc/motion/hand.py).
hand:
  # The wrist roll at which the gripper, pointing straight down, closes its jaws across the arm, along the wrist
  # flex's axis: in the rest pose the line between the jaws runs down the arm's middle with the roll reading about 0
  # (Oct 29). The URDF puts that a quarter turn away.
  across_roll_deg: 0
  # Which side the moving jaw is on, left or right, standing behind the base looking out along the arm with the gripper
  # pointing straight down at the rest roll. One jaw is fixed, so a pick puts that one beside the thing; without this,
  # picks are refused. Left, from a look at the arm (Oct 30).
  moving_jaw: left
  # Ask again over the thing, before the jaws open and go down, so a jaw line or a spot that's wrong stops there.
  # Turn it off once picks land where they should.
  check_over: true

# Servo ids, and the signs wbc/motion/joints.py maps raw ticks with: q = sign * (raw - 2047) * 2 pi / 4096 radians.
# The URDF's zero is lerobot-calibrate's Part 1 L pose (base facing forward, upper arm straight up, forearm and
# gripper level pointing forward), where every joint reads raw 2047. Sign 1 means raw rising turns the joint the
# URDF's positive way. Checked by hand on Oct 28 with the motors off, each joint turned in a pose where the move
# reads clearly: raw rises as the base turns clockwise seen from above, the shoulder lift tips forward, the elbow
# folds, the wrist flex tips the gripper down, and the wrist roll turns counterclockwise looking from the wrist
# toward the jaw tips, which is each joint's URDF plus. scripts/check_joint_map.py re-checks it. The gripper isn't
# in the IK chain, so it has no sign.
servos:
  shoulder_pan: {id: 1, sign: 1}
  shoulder_lift: {id: 2, sign: 1}
  elbow_flex: {id: 3, sign: 1}
  wrist_flex: {id: 4, sign: 1}
  wrist_roll: {id: 5, sign: 1}
  gripper: {id: 6}

# P gains written over the 16 that LeRobot's configure() gives every joint, each time after it runs. The elbow is a
# weaker 1:191 servo: at 16 it couldn't lift its folded forearm (Oct 27, 18:09), and at 32 it opened from the fold
# and held within 0.1° (18:25). At 16 the gripper stops where its push near closed meets the friction, short of
# gripping the multimeter probe at the jaw tips; at 32 it holds it there (Oct 29, 21:25).
gains:
  elbow_flex: 32
  gripper: 32
