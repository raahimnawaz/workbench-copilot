; Demo board firmware. Build with: pio run -d firmware/dut_demo
; Upload with:                    pio run -d firmware/dut_demo -t upload

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
