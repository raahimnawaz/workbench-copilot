[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-copilot"
version = "0.1.0"
description = "An AI lab partner on your workbench: a Muse Spark router that calls Muse Wonder, SAM 3.1 and Voice Transcribe, and drives an SO-101 arm."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.66",
    "pyyaml>=6",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4", "pynput>=1.7"]
arm = ["pyserial>=3.5"]
firmware = ["platformio>=6.1"]   # builds and flashes the ESP32 firmware; also turns on ask_coder's compile check
dev = ["pytest>=8"]

[project.scripts]
wbc = "wbc.agent.__main__:main"

[tool.setuptools.packages.find]
include = ["wbc*"]

[tool.setuptools.package-data]
"wbc.agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
