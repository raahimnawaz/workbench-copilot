; Force sensor sampler. Build with: pio run -d firmware/fsr_sampler
; Upload with:                     pio run -d firmware/fsr_sampler -t upload --upload-port /dev/cu.usbserial-XXXX

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 921600
