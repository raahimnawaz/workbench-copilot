# Every model id and price lives here, never in code, so a renamed preview model is a one-line change.
# Ids come from Meta's model page and playground. Prices marked "third-party" come from write-ups, not Meta's
# pricing page.

api:
  base_url: https://api.meta.ai/v1

router:
  model: muse-spark-1.3
  fallback: muse-spark-1.1          # the version in Meta's tool-calling examples
  max_steps: 12                     # tool rounds per turn before the loop gives up
  # Routing is short decisions; the coder and the tools do the heavy work.
  effort: low
  # Code runs these before Spark's first call of every turn and sends what changed since Spark last saw it,
  # so Spark starts with the bench facts instead of spending a round asking for them. One with keep: true runs
  # once, at start-up, and its result stands in for it on later turns until Spark calls that tool itself.
  prefetch:
    # A board read takes 6-9 s, 5 of them opening the camera, and a second read of the same wiring can miss a
    # wire. The kept read is checked against pins.h each turn, so a staged fix shows.
    - {tool: read_breadboard, keep: true}
    - {tool: read_schematic, keep: true}   # the design, from KiCad: under 1 s
    - {tool: read_file, args: {path: firmware/dut_demo/include/pins.h}}

coder:
  model: muse-wonder-1.0
  effort: low
  timeout_s: 30
  max_files: 4
  auto_stage: true                  # stage a diff that applies and compiles at once, saving a router round
  compile_cmd: pio run -d firmware/dut_demo   # runs in a sandbox copy; leave empty to skip
  compile_dir: firmware/dut_demo
  compile_timeout_s: 180

eyes:
  model: sam-3.1                    # request format from dev.meta.ai/docs/sam: one noun phrase per request
  timeout_s: 30

ears:
  model: muse-voice-transcribe-1.0
  url: https://api.meta.ai/v1/asr/transcribe  # checked against the live API on 2026-10-26
  sample_rate: 16000
  input_device: Razer Seiren Mini   # the bench mic, matched by name (the C920 is the camera)
  # Hands free: "Copilot, check my wiring." Every utterance is transcribed; only these go to the router.
  wake_phrase: copilot
  # Acronyms only. In a test, hints fixed "SBI" -> SPI and "Mosley" -> MOSI, while adding "pins.h"
  # and "chip select" made those phrases come out worse ("pinsh h", "chip chip select"). ADC is untested
  # as a hint.
  keywords: [GPIO, ADC, regrasp]

mouth:                              # spoken replies (--voice or --speak): Meta's API has no TTS
  command: scripts/kokoro-say       # Kokoro-82M on this Mac (scripts/kokoro_server.py); none: macOS `say`, whose
                                    # voices can't be in a published video
  voice: af_heart                   # a Kokoro voice (GET /voices on its server); with `say`, a name from `say -v '?'`
  rate: null                        # words a minute; null keeps the system rate
  sentences: 2                      # how much of each reply is said; the HUD shows all of it
  tail_s: 0.4                       # the mic stays muted this long after speech ends, for the room's echo

fast_arm:                           # arm commands without Spark (wbc/agent/fast_arm.py): rules, then Llama agrees
  # Served on this Mac in its own venv: mlx_lm.server --model mlx-community/Llama-3.2-3B-Instruct-4bit --port 8090
  # --prompt-cache-bytes 536870912. Not running, every request goes to the router as before.
  base_url: http://127.0.0.1:8090/v1
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  label: Llama 3.2 3B
  timeout_s: 3.0                    # a slower answer leaves the request to the router (warm ones take about 0.16 s)
  keep_warm_s: 20                   # a request this often keeps it warm: idle 2 minutes, an answer took 0.5 s
  things:                           # what the fast path moves, by the name locate looks for, with the ears' spellings
    screwdriver: [screw driver]
    tweezers: [tweezer]
    pliers: [plier, plyers]
  places:                           # where it puts them; a note's quoted place counts too, for "put it away"
    sticky note: [yellow sticky note, sticky notes, post it note, post it]
    cup: [mug]
    tray: [blue tray]

open:                               # Muse Spark Open on Baseten: questions no tool is needed for (wbc/agent/loop.py)
  model: meta-models/muse-spark-open-1026
  base_url: https://inference.baseten.co/v1
  key_env: BASETEN_API_KEY          # from the environment or .env; without it, every question goes to the router
  label: Spark Open

backup:                             # open-weights router served on your own machine
  model: muse-glimmer-30b           # the name your local server registers
  base_url: http://127.0.0.1:8080/v1
  reasoning: medium                 # Glimmer reads "Reasoning strength: <value>" from the system prompt

memory:                             # what outlives a conversation (wbc/agent/memory.py); both files stay in .wbc/
  session_file: .wbc/session.json   # each turn's record and a summary; --resume picks it up (--sim: session-sim.json)
  notebook_file: .wbc/notebook.jsonl  # facts the router keeps with `remember`, which every session sees
  # Summarize and start a new conversation once a call's input reaches this many tokens. Spark's context
  # window isn't documented, so this stays well under any likely size.
  compact_at_tokens: 60000
  keep_turns: 40                    # ...or once this many turns have piled up since the last summary
  notebook_in_prompt: 20            # newest notes the router sees every turn; recall finds the rest
  # embeddings: {base_url: http://127.0.0.1:8091/v1, model: <name>}   # optional: matches by meaning beside words

budget:
  # Hard stop. Every paid call checks it first, and the agent, coder, voice and smoke test stop once
  # tracked spend reaches it. It sits a little under the $150 credit because the prices below are
  # estimates, and calls made outside this repo (the playground, another machine) aren't tracked.
  limit_usd: 140
  warn_usd: 100                     # printed once, when tracked spend passes it
  state_file: .wbc/spend.json
  prices:                           # USD. Tokens per 1M, audio per hour, images per 1,000.
    muse-spark-1.3: {in: 1.25, cached_in: 0.15, out: 4.25}      # third-party
    muse-spark-1.1: {in: 1.25, cached_in: 0.15, out: 4.25}      # cached rate assumed equal to 1.3
    muse-wonder-1.0: {in: 4.00, cached_in: 0.20, out: 20.00}    # third-party
    muse-voice-transcribe-1.0: {per_hour: 0.18}                # third-party
    sam-3.1: {per_1k_images: 2.50}                              # Meta's pricing page
    muse-glimmer-30b: {in: 0, out: 0}                           # runs locally
    meta-models/muse-spark-open-1026: {in: 1.00, out: 4.00}    # a placeholder: Baseten's price not checked
