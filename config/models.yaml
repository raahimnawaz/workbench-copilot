# Every model id and price lives here, never in code, so a renamed preview model is a one-line change.
# Ids come from Meta's model page and playground (checked 2026-10-26).
# Prices marked "third-party" come from write-ups, not Meta's pricing page. Confirm them on Day 1.

api:
  base_url: https://api.meta.ai/v1

router:
  model: muse-spark-1.3
  fallback: muse-spark-1.1          # the version in Meta's tool-calling examples
  max_steps: 12                     # tool rounds per turn before the loop gives up
  # Routing is short decisions; the coder and the tools do the heavy work. Act 1's router calls took
  # about 19 s each at the API default (Oct 26) and 4.4-14.0 s at "low" (Oct 28).
  effort: low
  # Code runs these before Spark's first call of every turn and sends what changed since Spark last saw it,
  # so Spark starts with the bench facts instead of spending a round asking for them.
  prefetch:
    - {tool: read_breadboard}
    - {tool: read_file, args: {path: firmware/dut_demo/include/pins.h}}

coder:
  model: muse-wonder-1.0
  effort: low
  timeout_s: 30
  max_files: 4
  auto_stage: true                  # stage a diff that applies and compiles at once, saving a router round
  compile_cmd: pio run -d firmware/dut_demo   # runs in a sandbox copy; leave empty to skip
  compile_dir: firmware/dut_demo
  compile_timeout_s: 180

eyes:
  model: sam-3.1                    # request format from dev.meta.ai/docs/sam (Oct 28): one noun phrase per request
  timeout_s: 30
  fallback: local                   # facebook/sam3.1 weights, gated on Hugging Face: requested, not granted (Oct 28)

ears:
  model: muse-voice-transcribe-1.0
  url: https://api.meta.ai/v1/asr/transcribe  # checked against the live API on 2026-10-26
  sample_rate: 16000
  input_device: Razer Seiren Mini   # the bench mic, matched by name (the C920 is the camera)
  # Hands free: "Copilot, check my wiring." Every utterance is transcribed; only these go to the router.
  wake_phrase: copilot
  # Acronyms only. In a test, these fixed "SBI" -> SPI and "Mosley" -> MOSI, while adding "pins.h"
  # and "chip select" made those phrases come out worse ("pinsh h", "chip chip select").
  keywords: [SPI, GPIO, MOSI, SCK, OLED, regrasp]

backup:                             # open-weights router served on your own machine
  model: muse-glimmer-30b           # the name your local server registers
  base_url: http://127.0.0.1:8080/v1
  reasoning: medium                 # Glimmer reads "Reasoning strength: <value>" from the system prompt

budget:
  # Hard stop. Every paid call checks it first, and the agent, coder, voice and smoke test stop once
  # tracked spend reaches it. It sits a little under the $150 credit because the prices below are
  # estimates, and calls made outside this repo (the playground, another machine) aren't tracked.
  limit_usd: 140
  warn_usd: 100                     # printed once, when tracked spend passes it
  state_file: .wbc/spend.json
  prices:                           # USD. Tokens per 1M, audio per hour, images per 1,000.
    muse-spark-1.3: {in: 1.25, cached_in: 0.15, out: 4.25}      # third-party
    muse-spark-1.1: {in: 1.25, cached_in: 0.15, out: 4.25}      # cached rate assumed equal to 1.3
    muse-wonder-1.0: {in: 4.00, cached_in: 0.20, out: 20.00}    # third-party
    muse-voice-transcribe-1.0: {per_hour: 0.18}                # third-party
    sam-3.1: {per_1k_images: 2.50}                              # Meta's pricing page (Oct 28)
    muse-glimmer-30b: {in: 0, out: 0}                           # runs locally
