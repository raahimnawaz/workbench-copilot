# SO-101 kinematic chain, read from TheRobotStudio's URDF (vendored unchanged in hardware/, Apache-2.0).
urdf: hardware/so101_new_calib.urdf
base_link: base_link
tip_link: gripper_frame_link          # the point between the jaws
joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]

# In the URDF the gripper's approach direction is its z-axis. Turning the tool frame -90° about y
# makes approach the x-axis, which is what kinematics.task_to_pose expects. xyz moves the tool point from the URDF's
# point between the jaws to the closed jaws' tips, by a four-touch test: one dot touched straight down over 255° of
# wrist roll reads 11.6 mm rms apart with the URDF's point and 4.9 with this, which puts the tips 3.7 mm from the roll's
# axis instead of 7.9. Along the gripper it stays 0.
tool:
  xyz: [-0.0059, -0.00286, 0]
  rpy: [0, -1.5708, 0]

# The table under the arm (wbc/motion/table.py): the driver's floors are measured from it. The desk sits about 15 mm
# under the URDF's z 0 near the base, which stands about 0.6 in tall, and reads lower the further out the arm reaches,
# most likely its joints' zeros. Touched with the arm (desk tags 20-22, 24 and 25 and the carrier's 10 and 13, 101-377
# mm from the base's pan axis, at bearings -89° to +36°) it's -7.4 mm at the pan axis falling 92.0 mm per m of reach,
# every tag within 1.7 mm.
# The floors add a 2 mm margin. Nearer or further out than the touches, the table is the higher of the line and its
# nearest touched end, and past their bearings it rises over 10° to the highest the line reached, never lower; a pick
# is refused where it's held more than 2 mm high. scripts/desk_camera.py table prints these lines again after a
# re-touch.
table:
  at_base_mm: -7.4
  slope_mm_per_m: -92.0
  reach_mm: [101, 377]
  margin_mm: 2.0
  axis_mm: [38.8353, 0.0]
  bearing_deg: [-89, 36]

# How close the tool point, the jaw tips, may come to that table, mm. The driver's default is 10, and 5 the least it
# takes: the arm sagging 5 mm under a floor cuts every motor. 5 lets a pick put the tips about halfway up a 16 mm handle
# lying 13-20 cm out, 6 mm over that cut, so a pick reads how far the arm sags just over the handle first and stops
# there if going down would leave under 1 mm of it. The elbow and wrist axes keep their 30 mm.
tool_floor_mm: 5

# The arm's servo adapter, for python -m wbc.agent --arm, and lerobot-calibrate's folder when it's another macOS
# account's (empty: this account's own).
port: /dev/cu.usbmodem5B910297421
calibration_dir:

# Picking things up and putting them down (wbc/motion/hand.py).
hand:
  # The wrist roll at which the gripper, pointing straight down, closes its jaws across the arm, along the wrist
  # flex's axis: in the rest pose the line between the jaws runs down the arm's middle with the roll reading about 0.
  # The URDF puts that a quarter turn away.
  across_roll_deg: 0
  # Which side the moving jaw is on, left or right, standing behind the base looking out along the arm with the gripper
  # pointing straight down at the rest roll. One jaw is fixed, so a pick puts that one beside the thing; without this,
  # picks are refused. Left: in the gripper's standard upright pose, the wrist roll at about 0°, the jaw that moves
  # is on the arm's left.
  moving_jaw: left
  # What lets an arm move go. request: the request itself, spoken or typed ("Copilot, put the screwdriver away"), so the
  # arm moves at once; "Copilot, stop" (or "Stop!" on its own) holds it where it is, and Ctrl-C or the strip cuts it.
  # enter: each move also waits for Enter at the keyboard, with check_over's second question, for bench tests
  # (python -m wbc.agent --enter does the same for one run).
  go_ahead: request
  # With go_ahead enter, ask again over the thing with the jaws open, before they go down, so a spot, a jaw line or a
  # fixed jaw over the thing instead of beside it stops there. Turn it off once picks land where they should.
  check_over: true
  # Places a put stands what's held in on end, by name, with how tall each stands (mm): a put turns the gripper up
  # from straight down until it's on end over the opening and lets go once its lower end is inside the rim. The
  # height here wins over any given in the request, since it's measured: the mug, just under 4 in.
  containers: {cup: 98, mug: 98}
  # Where the arm waits between requests, empty-handed, with its motors on (URDF degrees: pan, lift, elbow, wrist flex,
  # wrist roll): the L pose with the gripper pointing straight down, the jaw tips about 230 mm out and 100 mm over the
  # desk. A move that worked and left the jaws empty ends here, and arm_home comes here. Holding gravity there takes
  # about 0.42 N·m on the shoulder lift and 0.34 on the elbow (from the URDF's masses), where the folded rest takes
  # 0.16 and 0.25. The arm can't stay here unpowered, so the end of a session still parks it at rest before the
  # motors go off. Delete the line to have the arm wait where its last move ended.
  idle_deg: [0, 0, 0, 90, 0]

# Servo ids, and the signs wbc/motion/joints.py maps raw ticks with: q = sign * (raw - 2047) * 2 pi / 4096 radians.
# The URDF's zero is lerobot-calibrate's Part 1 L pose (base facing forward, upper arm straight up, forearm and
# gripper level pointing forward), where every joint reads raw 2047. Sign 1 means raw rising turns the joint the
# URDF's positive way. Checked by hand with the motors off, each joint turned in a pose where the move
# reads clearly: raw rises as the base turns clockwise seen from above, the shoulder lift tips forward, the elbow
# folds, the wrist flex tips the gripper down, and the wrist roll turns counterclockwise looking from the wrist
# toward the jaw tips, which is each joint's URDF plus. scripts/check_joint_map.py re-checks it. The gripper isn't
# in the IK chain, so it has no sign.
servos:
  shoulder_pan: {id: 1, sign: 1}
  shoulder_lift: {id: 2, sign: 1}
  elbow_flex: {id: 3, sign: 1}
  wrist_flex: {id: 4, sign: 1}
  wrist_roll: {id: 5, sign: 1}
  gripper: {id: 6}

# The wrist roll turns all the way round, so its calibration has no stop and moves keep it inside the URDF's limits,
# clear of where its reading wraps. It does stop at about -80°, where a move driving it further holds until its load
# trips the 5° stray cut. So it's narrowed here (degrees, inside the URDF's), and a move keeps RANGE_MARGIN inside
# that; a pick takes the other way round instead.
limits_deg:
  wrist_roll: [-78, 180]

# P gains written over the 16 that LeRobot's configure() gives every joint, each time after it runs. At 32 the elbow
# lifts the forearm from flat to straight up at the speed caps, lagging 3.5° at most. At 16 the gripper stops where its
# push near closed meets the friction, short of gripping the multimeter probe at the jaw tips; at 32 it holds it there.
# At 16 the base, shoulder lift and wrist flex lag 3-5° behind their goals under a load, in jerks, up to the driver's
# 5° stray cut while carrying a screwdriver; at 32 they lag 2.1-2.8° at most.
gains:
  shoulder_pan: 32
  shoulder_lift: 32
  elbow_flex: 32
  wrist_flex: 32
  gripper: 32
