<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse orb</title>
<!-- The Muse orb, the HUD's face for the workbench copilot. One page with no build step and no packages: canvas, WebGL
     and the saved Siri line (saved/siri-line.js, unchanged, only stretched). CREDITS.md beside it lists everything it
     borrows; HOWTO.md says how to run it and drive it.
     - The orb is a sphere of dots on a black sky, turning on the Siri line, which runs through its middle and out both
       sides like a spear. The line is the brightest thing on the page. It's dimmed a little while it's inside the
       sphere, a soft light shines from behind its waves with a little gold at its heart, and the voice light runs along
       its waves.
     - Each stage is its own sea on the sphere: a long swell at rest, a wind sea built by the voice while listening, a
       swell from the spear's near end while speaking, a cross sea while Spark thinks, a long swell sweeping round the
       spear while SAM looks at the board, a steep confused sea while Wonder writes code. The sea changes from one to
       the next over a few seconds, the way weather does. Each is a handful of wave trains with deep water's dispersion,
       ω² = g k, and Gerstner's orbits. The circle stays round: the waves carry the dots along the surface, bunching
       them on the crests; a crest swells and brightens the dots it passes, a trough dims them, and the steepest crests
       whitecap.
     - The dots are clear light, the way the line glows: each its color laid on as light and edged in the line's liquid
       metal, joined to its neighbours by faint white lines that stop at its edge. They part round the spear, more
       while its waves are up. Their light streams outward like light through stained glass: a bloom and sun rays in
       the dots' own colors (ported from PavelDoGreat's WebGL-Fluid-Simulation, MIT, notice at the end).
     - The dots' colors come in sections by how squarely each faces you, rippling with the waves: face-on the deep
       primary blue, then violet and the active model's color, and the contrast color (the primary's and the model's
       hues averaged and turned half round) warming the rim. While it listens or talks, a voice glow in the orb's own
       colors rises from the bottom through the dots. A dot a crest whitecaps or the voice reaches lights up as a
       brighter, lighter version of its own color, not white.
     - The model's name is white, edged in black liquid metal that glints in the model's colors, on a pane of glass;
       "on Baseten" is bright green metal. The reply comes in a sentence at a time, white with a touch of light orange
       and a glowing Meta-blue outline, in a glass bubble that grows to fit it, its outline faint like a shadow. The
       metal is our own WebGL shader, after libraries.dev's Metal.
     - The call bar at the bottom lists each model call with its time. A model comes in the moment it starts, its dot
       a tiny orb in that model's colors, breathing until its time comes in.
     - The typed way in is a text and file box with a beam of the orb's colors riding its border, a paperclip, and a
       send button of live black metal that catches the beam and sinks in when pressed.
     - The sky is a faint neural map: while the orb works, nodes fire in its colors and the signal runs along the links.
     - Opened by the copilot (python -m wbc.agent --hud, at http://127.0.0.1:8766/), the page shows it live: each event
       the agent sends over Server-Sent Events is a call to one of the functions in README.md, and the mocked Act 1
       doesn't play. Opened on its own, it plays the mock.
     Keys: A plays Act 1, H hides the controls, C opens the camera. -->
<style>
  :root { --ink: #f5f5f7; --muted: rgba(245, 245, 247, .62); --glass: rgba(255, 255, 255, .08); --edge: rgba(255, 255, 255, .18);
          --m-warm: #ffd7b5; --m-cool: #95aed6; --m-tint: #c6b2e6; --m-pos: 0%; --b1: #3054C6; --b2: #E040FB; --b3: #62B4FF; --sheen: 50%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  /* black with a little depth: a faint blue haze round the orb over the dark falloff */
  body { background: radial-gradient(55% 45% at 50% 30%, rgba(38, 62, 150, .1), rgba(22, 32, 86, .05) 45%, transparent 75%),
                     radial-gradient(70% 70% at 50% 38%, #0c0e16 0%, #000 72%); }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* live liquid metal: a canvas over the words draws the name white, edged in black metal glinting in the model's
     colors, and the reply white outlined in blue, where the page lays them out; the page's own text stays for
     selecting and reading aloud, but invisible. The send button draws its own. Without WebGL the CSS metal below
     stays */
  #metalfx { position: fixed; left: 0; top: 0; z-index: 3; display: none; pointer-events: none; }
  /* the live liquid glass on the panes behind the words: see liquidGlass */
  #glassfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  /* the dots' light (see the light section), laid over the orb and added to the page */
  #lightfx { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; mix-blend-mode: plus-lighter; }
  body.live .metal, body.live .baseten { background: none; color: transparent; -webkit-text-fill-color: transparent; filter: none; }
  /* the send button in live metal: it draws its body in black metal and its outline and arrow in silver, and presses
     in without its outline moving */
  .metalbtn { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
  body.live .metalbtn { display: block; }
  body.live #send { position: relative; background: #050608; overflow: hidden; }
  body.live #send svg { visibility: hidden; }
  body.live #send:active { transform: none; }
  /* liquid metal, after libraries.dev's Liquid Metal (recreated in CSS): chrome whose reflections take the orb's colors; the script moves its sheen as the sphere turns */
  .metal { background: linear-gradient(105deg, #8b929d 0%, #eef1f5 14%, #a2abb7 26%, var(--m-warm) 38%, #f4f6f9 47%,
                                       var(--m-cool) 58%, #e9edf2 70%, var(--m-tint) 80%, #f5f7fa 90%, #8b929d 100%);
           background-size: 300% 100%; background-position: var(--m-pos) 50%; -webkit-background-clip: text; background-clip: text;
           color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .35)); }
  /* "on Baseten" in Baseten's green metal, its sheen moving with the orb like the other metal */
  .baseten { background: linear-gradient(105deg, #1c8f4b 0%, #c6f7d8 18%, #31E572 34%, #0f6b36 48%, #e9fff1 62%, #31E572 78%,
                                         #1c8f4b 100%);
             background-size: 300% 100%; background-position: var(--m-pos) 50%; -webkit-background-clip: text; background-clip: text;
             color: transparent; -webkit-text-fill-color: transparent; font-weight: 700; }
  /* the typed way in: a text and file box with a beam of the orb's colors riding its border, after libraries.dev's
     Border Beam (recreated in CSS) */
  @property --beam { syntax: '<angle>'; initial-value: 0deg; inherits: true; }
  #ask { position: fixed; z-index: 2; left: 50%; bottom: 7.5vh; transform: translateX(-50%); width: min(640px, 86vw);
         display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 18px;
         background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .06) 48%, transparent 58%) var(--sheen) 0 / 300% 100% no-repeat,
                     rgba(14, 18, 34, .72); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
         box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 12px 40px rgba(0, 0, 0, .35); }
  #ask::before, #ask::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
         background: conic-gradient(from var(--beam), transparent 0deg 240deg, var(--b1) 285deg, var(--b2) 320deg, var(--b3) 345deg,
                                    transparent 360deg); }
  #ask::before { padding: 1.5px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                 -webkit-mask-composite: xor; mask-composite: exclude; }
  #ask::after { z-index: -1; inset: -2px; filter: blur(14px); opacity: .45; }
  #ask input[type=text] { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: inherit;
                          font-size: 16px; padding: 8px 4px; }
  #ask input::placeholder { color: rgba(245, 245, 247, .4); }
  #attach, #send { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
                   color: rgba(245, 245, 247, .75); background: rgba(255, 255, 255, .06); border: 0; }
  /* the send button in dark gunmetal liquid metal. The script sets the beam's light (--refl, and a white core --spec)
     and where it falls (--rx --ry): the side of the button facing the beam's head */
  #send { color: #e9edf2;
          background: radial-gradient(38% 38% at var(--rx, 50%) var(--ry, 0%), var(--spec, transparent) 0%, transparent 100%),
                      radial-gradient(95% 95% at var(--rx, 50%) var(--ry, 0%), var(--refl, transparent) 0%, transparent 62%),
                      linear-gradient(160deg, #6b7380 0%, #2b3038 36%, #59616d 54%, #1b1f26 78%, #3a414c 100%);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .45); }
  /* the paperclip keeps its dark glass, with a small reflection of the beam */
  #attach { background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .08) 48%, transparent 58%) var(--sheen) 0 / 300% 100% no-repeat, radial-gradient(90% 90% at var(--rx, 50%) var(--ry, 0%), var(--refl, transparent) 0%, transparent 68%), rgba(255, 255, 255, .06); }
  #attach:hover { background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .08) 48%, transparent 58%) var(--sheen) 0 / 300% 100% no-repeat, radial-gradient(90% 90% at var(--rx, 50%) var(--ry, 0%), var(--refl, transparent) 0%, transparent 68%), rgba(255, 255, 255, .1); }
  #attach:active, #send:active { transform: scale(.95); }
  #chip { flex: none; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
          color: var(--ink); background: rgba(255, 255, 255, .08); border-radius: 8px; padding: 4px 8px; }
  #grain { position: fixed; inset: 0; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  main { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding-bottom: 12vh; }
  #orb { width: 100vw; height: 56vh; display: block; }
  #model { font-size: clamp(20px, 2.6vh, 30px); font-weight: 600; letter-spacing: -0.01em; }
  /* the model's name and the reply sit on panes of glass with a soft top sheen, so their metal has something to stand
     against; the reply's is a bubble that grows to fit each sentence as it comes in (see wrapReply) */
  #model { position: relative; isolation: isolate; padding: .16em .8em .22em; }
  #model::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 999px; }
  #bubble { position: absolute; left: 0; top: 0; z-index: -1; width: 0; height: 0; opacity: 0; pointer-events: none; }
  /* the reply bubble's outline: a faint, soft semi-translucent gradient, more a shadow than a line: barely light at the
     top left where the lamp is, fading round the sides into a soft dark edge */
  #bubble::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
                    background: linear-gradient(115deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04) 40%, rgba(0, 0, 0, .22) 70%,
                                                rgba(0, 0, 0, .34)); filter: blur(.5px);
                    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
                    mask-composite: exclude; }
  #model::before, #bubble { background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .08) 48%, transparent 58%) var(--sheen) 0 / 300% 100% no-repeat,
                                        linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02) 55%, rgba(255, 255, 255, .045));
                            border: 1px solid rgba(255, 255, 255, .17);
                            -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
                            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(0, 0, 0, .3), inset 0 0 14px rgba(255, 255, 255, .05),
                                        0 10px 30px rgba(0, 0, 0, .45); }
  #bubble { border-color: transparent;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -1px 0 rgba(0, 0, 0, .3), inset 0 0 14px rgba(255, 255, 255, .03),
                        0 10px 30px rgba(0, 0, 0, .45); }
  #role { font-size: clamp(14px, 1.8vh, 20px); color: var(--muted); margin-top: 2px; }
  #you { font-size: clamp(15px, 2vh, 22px); color: var(--muted); margin-top: 2.4vh; min-height: 1.5em;
         max-width: 80vw; text-align: center; }
  #say { font-size: clamp(24px, 3.6vh, 44px); font-weight: 500; letter-spacing: -0.015em; line-height: 1.25;
         margin-top: .6vh; min-height: 2.6em; max-width: min(84vw, 1100px); text-align: center; }
  #say b { font-weight: 700; }
  /* each sentence of the reply fades in quickly, one after another */
  #say .arrive { opacity: 0; animation: arrive .3s ease-out forwards; }
  @keyframes arrive { to { opacity: 1; } }
  #calls { position: fixed; z-index: 1; left: 0; right: 0; bottom: 2.2vh; display: flex; justify-content: center; flex-wrap: wrap;
           gap: 8px 22px; padding: 0 40px; font-size: clamp(14px, 1.8vh, 20px); color: var(--muted); }
  #calls span { display: inline-flex; align-items: center; gap: 8px; animation: rise .5s ease both; }
  #calls i { width: 11px; height: 11px; border-radius: 50%; }
  /* a call still running: its dot breathes until its time comes in */
  #calls span.pending i { animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.72); opacity: .55; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .glass { background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .1) 48%, transparent 58%) var(--sheen) 0 / 300% 100% no-repeat, var(--glass); border: 1px solid var(--edge); color: var(--ink);
           -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
           box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 10px 30px rgba(0, 0, 0, .3); }
  #cam { position: fixed; z-index: 2; top: 22px; right: 26px; font: inherit; font-size: 15px; border-radius: 980px;
         padding: 8px 18px; cursor: pointer; }
  #cam:active, #dev button:active { transform: scale(.96); }
  #panel { position: fixed; z-index: 2; top: 72px; right: 26px; width: min(40vw, 640px); aspect-ratio: 16 / 9; border-radius: 22px;
           overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 15px;
           opacity: 0; transform: scale(.94); transform-origin: top right; filter: blur(8px); pointer-events: none;
           transition: opacity .25s, transform .35s cubic-bezier(.2, .8, .2, 1), filter .35s; }
  #panel.open { opacity: 1; transform: none; filter: none; pointer-events: auto; }
  #panel video { width: 100%; height: 100%; object-fit: cover; }
  #dev { position: fixed; z-index: 2; top: 18px; left: 18px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 56vw;
         opacity: .55; transition: opacity .2s; }
  #dev:hover { opacity: 1; }
  #dev button { font: inherit; font-size: 12px; border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  #dev button.on { border-color: rgba(255, 255, 255, .7); }
  #dev .gap { width: 10px; }
  body.clean #dev { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #say .arrive { animation: none; opacity: 1; }
    #calls span, #calls span.pending i { animation: none; }
    #panel { transform: none; filter: none; transition: opacity .2s; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="grain"></div>
<button id="cam" class="glass">Camera</button>
<div id="panel" class="glass">Camera feed</div>
<main>
  <canvas id="orb"></canvas>
  <div id="model" class="metal"></div>
  <div id="role"></div>
  <div id="you"></div>
  <div id="bubble"></div>
  <div id="say"></div>
</main>
<canvas id="lightfx"></canvas>
<form id="ask" autocomplete="off">
  <label id="attach" title="Add a file" aria-label="Add a file">
    <input type="file" id="file" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
  </label>
  <input id="text" type="text" placeholder="Ask Muse, or add a file" aria-label="Ask Muse">
  <span id="chip" hidden></span>
  <button id="send" type="submit" aria-label="Send">
    <canvas id="sendfx" class="metalbtn"></canvas>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
</form>
<div id="calls"></div>
<div id="dev"></div>
<canvas id="glassfx"></canvas>
<canvas id="metalfx"></canvas>
<script src="saved/siri-line.js"></script>
<script>
const MODELS = {
  transcribe: { name: 'Voice Transcribe', short: 'Transcribe', role: 'hearing · Meta', color: '#FFFFFF' },
  spark: { name: 'Muse Spark 1.3', short: 'Spark', role: 'router · Meta', color: '#E040FB' },
  sam: { name: 'SAM 3.1', short: 'SAM', role: 'board reader · Meta', color: '#FF6B6B' },
  wonder: { name: 'Muse Wonder 1.0', short: 'Wonder', role: 'coder · Meta', color: '#FF8A1F' },
  open: { name: 'Muse Spark Open', short: 'Spark Open', role: 'open weights · <span class="baseten">on Baseten</span>', color: '#31E572' },
};
// the orb's colors: the primary blue (from the brand swatch), the active model's, and Muse's lighter blue (a stand-in)
const NAVY = '#3054C6', MUSE = '#62B4FF';
// wave: how much the voice lifts the line; voice: whether speech drives it. Listening, the line is the user's voice,
// as tall as Muse's when it speaks
const STATES = {
  idle: { wave: 0.05, voice: 0 },
  listening: { wave: 1, voice: 1 },
  thinking: { wave: 0.12, voice: 0 },
  speaking: { wave: 1, voice: 1 },
};
// the dots are always the one sea; what changes with the state is the sea state (see SEA_STATES), and this says which
// goes with what the orb is doing
function seaFor(state, model) {
  if (state === 'thinking') return model === 'sam' ? 'sam' : model === 'wonder' ? 'wonder' : 'spark';
  return state;
}
// the Siri line's angle: tilted on screen, and turned so its right end comes toward you. SPEAR stretches it
// lengthwise so it runs through and out both sides like a spear; LIFT makes it a little taller and heavier
// (LIFT is 15% less than the 1.25 it was tuned at, so the line is less pronounced)
const ROLL = -0.32, YAW = 0.6, SPEAR = 1.6, LIFT = 1.25 * .85;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
// opened by the copilot: "/" on its server sends the page here with ?live, and its events drive the page (at the end)
const LIVE = new URLSearchParams(location.search).has('live');

const TAU = Math.PI * 2;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const smooth = (a, b, v) => { const k = Math.min(1, Math.max(0, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const WHITE = [255, 255, 255], NAVY_RGB = hex(NAVY), MUSE_RGB = hex(MUSE);
const $ = id => document.getElementById(id);

const canvas = $('orb'), g = canvas.getContext('2d'), sky = $('stars'), sk = sky.getContext('2d');
// the soft light behind the waves, drawn at a quarter size, then blurred
const back = document.createElement('canvas'), bk = back.getContext('2d'), BACK = 4;
// the Siri line and its light, drawn into a layer of their own so the part inside the sphere can be dimmed
const LINE_LAYER = document.createElement('canvas'), lc = LINE_LAYER.getContext('2d');
// the coins past the rim, drawn at half size and blurred: depth of field
const soft = document.createElement('canvas'), sf = soft.getContext('2d');
const blurred = document.createElement('canvas'), sb = blurred.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  W = canvas.width = Math.round(r.width * DPR);
  H = canvas.height = Math.round(r.height * DPR);
  sky.width = Math.round(innerWidth * DPR);
  sky.height = Math.round(innerHeight * DPR);
  back.width = Math.ceil(W / BACK);
  back.height = Math.ceil(H / BACK);
  LINE_LAYER.width = W;
  LINE_LAYER.height = H;
  soft.width = blurred.width = Math.ceil(W / 2);
  soft.height = blurred.height = Math.ceil(H / 2);
}
addEventListener('resize', resize);
resize();

// --- the dots, on thinking-orbs' lattice (adapted, notice at the end)

const hashD = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
function angleDelta(a, b) {
  const d = (a - b) % TAU;
  return d > Math.PI ? d - TAU : d < -Math.PI ? d + TAU : d;
}


// the dots: thinking-orbs' lat/long lattice on the unit sphere. at is where a dot is drawn now:
// [x, y, z, size, lit, alpha] with x right, y up, z toward you, the sphere's radius 1
const RINGS = 21, DOTS = [];
for (let li = 0; li <= RINGS; li++) {
  const cl = Math.cos(-Math.PI / 2 + li / RINGS * Math.PI);
  const n = Math.max(1, Math.round(Math.abs(cl) * 55));
  for (let lj = 0; lj < n; lj++) {
    DOTS.push({ li, lon: lj / n * TAU, at: [0, 0, 1, 1, 0, 1] });
  }
}

// the data grid: each dot links to the next one round its latitude ring and to the nearest one in the ring above
const LINKS = [];
{
  const rings = [];
  DOTS.forEach((d, i) => (rings[d.li] = rings[d.li] || []).push(i));
  rings.forEach((ring, li) => ring.forEach((i, j) => {
    if (ring.length > 1) LINKS.push([i, ring[(j + 1) % ring.length]]);
    const up = rings[li + 1];
    if (!up) return;
    let best = up[0], gap = Infinity;
    for (const k of up) {
      const dd = Math.abs(angleDelta(DOTS[k].lon, DOTS[i].lon));
      if (dd < gap) { gap = dd; best = k; }
    }
    LINKS.push([i, best]);
  }));
}

// each dot's neighbours on the lattice (next and last round its ring, nearest above and below), to find which way the
// surface faces there
const AROUND = [];
{
  const rings = [];
  DOTS.forEach((d, i) => (rings[d.li] = rings[d.li] || []).push(i));

let model = 'spark', state = 'idle', mic = null;

    c.restore();
  };

  // the dots behind the line's tilted plane first, then the line, then the rest
  const cr = Math.cos(ROLL), sr = Math.sin(ROLL), slope = Math.tan(YAW) / R;
  const behindAt = (X, Y, z) => z < ((X - ox) * cr + (Y - oy) * sr) * slope, behind = it => behindAt(it.X, it.Y, it.z);
  // each dot's color, in sections by how squarely it faces you: face-on the deep primary blue, then violet and the
  // model's color as the surface turns away, and the contrast color warming the rim. Which way it faces comes from its
  // neighbours, placed as if the waves stood up off the sphere (six times as high as the light shows them), so the
  // sections ripple with the waves. One the voice glow rises through leans toward its colors. A dot a crest
  // whitecaps or the voice reaches lights up as a brighter, lighter version of its own color (its strongest channel
  // raised to full, a little white let in), not white. Its brightness comes from the waves too (bright on their
  // crests, dim in their troughs) and the voice, and it's dimmer behind the sphere
  const voiceOn = it => Math.max(voiceAt(it.X, it.Y), harmonicAt(it.X, it.Y));
  const swellOf = Object.values(SEA_STATES).reduce((q, s) => q + s.weight * s.amp, 0) * 1.5 + 1e-6;
  const deep = mix(beamRGB[0], [4, 6, 20], .45), violet = mix(beamRGB[0], cur.color, .5);
  const lighten = c => mix(c.map(x => x * 255 / Math.max(1, ...c)), WHITE, .18);
  const section = f => f > .82 ? mix(deep, beamRGB[0], (1 - f) / .18)
    : f > .58 ? mix(beamRGB[0], violet, (.82 - f) / .24)
    : f > .34 ? mix(violet, cur.color, (.58 - f) / .24)
    : f > .14 ? mix(cur.color, contrast, (.34 - f) / .2)
    : mix(contrast, mix(contrast, WHITE, .45), (.14 - f) / .14);
  const stood = placed.map((it, i) => {
    const k = 1 + 6 * DOTS[i].heave;
    return [(it.X - ox) / R * k, (oy - it.Y) / R * k, it.z * k];
  });
  placed.forEach((it, i) => {
    const d = DOTS[i], swell = Math.max(-1, Math.min(1, d.heave / swellOf)), cap = Math.max(it.lit, smooth(.12, .22, d.crest)), v = voiceOn(it);
    const [p1, p2, p3, p4] = AROUND[i].map(j => stood[j]), u = p1.map((x, k) => x - p2[k]), w = p3.map((x, k) => x - p4[k]);
    const n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]], l = Math.hypot(...n);
    it.col = section(l > 1e-9 ? Math.abs(n[2] / l) : Math.abs(it.n[2]));
    if (v > .01) it.col = mix(it.col, voiceColor((it.X - ox) / R, t), v * .5);
    it.on = Math.min(1, Math.max(cap, v));
    it.lightCol = lighten(it.col);
    it.col = mix(it.col, it.lightCol, it.on);
    it.bright = Math.min(1, (.38 + .32 * (.5 + .5 * swell) + .5 * it.on) * (.3 + .7 * smooth(-.4, .5, it.n[2])) * it.a);
    // a third dimmer at their brightest, less so the dimmer they are, so the line is what stands out
    it.bright *= 1 - .33 * it.bright;
    // the two dots at the poles sit on the spear's axis, where it comes through, so they're left out
    if (d.li === 0 || d.li === RINGS) it.bright = 0;
  });
  // each dot as clear light, the way the line glows: its color laid over the dark as light (.42, added, as the line's
  // lobes are), and edged in the line's liquid metal (the same stops, laid along the line, so dots near it match it)
  const chrome = g.createLinearGradient(ox - half * stretch * cR, oy - half * stretch * sR, ox + half * stretch * cR, oy + half * stretch * sR);
  for (const [o, col] of CHROME) chrome.addColorStop(o, col);
  const sizeOf = it => it.r * .85 * (1 + .3 * it.on);
  // the faint white lines and the dots on one side of the line's plane, on the orb
  const shine = front => {
    const paths = [new Path2D(), new Path2D(), new Path2D()], longest = (.32 * R) ** 2;
    for (const [i, k] of LINKS) {
      const p = placed[i], q = placed[k];
      if (p.bright < .01 || q.bright < .01 || (p.X - q.X) ** 2 + (p.Y - q.Y) ** 2 > longest) continue;
      if (behindAt((p.X + q.X) / 2, (p.Y + q.Y) / 2, (p.z + q.z) / 2) === front) continue;
      const near = (smooth(-.4, .5, p.n[2]) + smooth(-.4, .5, q.n[2])) / 2, path = paths[near > .66 ? 2 : near > .33 ? 1 : 0];
      // each line stops at the dots' edges, so none shows inside the clear dots
      const dx = q.X - p.X, dy = q.Y - p.Y, len = Math.hypot(dx, dy), rp = sizeOf(p) + .5 * DPR, rq = sizeOf(q) + .5 * DPR;
      if (len <= rp + rq) continue;
      path.moveTo(p.X + dx * rp / len, p.Y + dy * rp / len);
      path.lineTo(q.X - dx * rq / len, q.Y - dy * rq / len);
    }
    const these = items.filter(it => behind(it) !== front && it.bright >= .01);
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineWidth = .6 * DPR;
    g.strokeStyle = '#fff';
    paths.forEach((path, b) => { g.globalAlpha = .05 + .06 * b; g.stroke(path); });
    for (const it of these) {
      g.globalAlpha = Math.min(1, it.bright * (1 + .15 * it.on)) * .78;
      g.fillStyle = rgba(it.col, .42);
      g.beginPath();
      g.arc(it.X, it.Y, sizeOf(it), 0, TAU);
      g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    g.lineWidth = .8 * DPR;
    for (const it of these) {
      // a lit dot's edge turns from the line's white metal to its own bright color
      g.strokeStyle = chrome;
      g.globalAlpha = it.bright * .5 * (1 - .75 * it.on);
      g.beginPath();
      g.arc(it.X, it.Y, sizeOf(it), 0, TAU);
      g.stroke();
      if (it.on < .05) continue;
      g.strokeStyle = rgba(it.lightCol, 1);
      g.globalAlpha = it.bright * .5 * it.on;
      g.stroke();
    }
    g.restore();
  };
  // the Siri line and its light go into their own layer, where the part of the spear inside the sphere is dimmed: it
  // reads as running through the planet's middle, bright where it comes out of the near side, fainter inside, and
  // faintest where it's behind the planet
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, W, H);
  backlight(lc);
  lc.save();
  lc.translate(ox, oy);
  lc.rotate(ROLL);
  lc.scale(Math.cos(YAW) * SPEAR, LIFT);
  line.draw(lc, 0, 0, R * 1.35, R * 1.45, [NAVY_RGB, MUSE_RGB, cur.color], DPR);
  lc.restore();
  harmonicLight(lc);
  const pole = Math.cos(YAW) * R * .95, span = R * 1.05, along = u => Math.min(1, Math.max(0, (u / span + 1) / 2));
  const inside = lc.createLinearGradient(ox - cR * span, oy - sR * span, ox + cR * span, oy + sR * span);
  inside.addColorStop(0, rgba([0, 0, 0], .45));
  inside.addColorStop(along(-pole), rgba([0, 0, 0], .36));
  inside.addColorStop(along(pole * .82), rgba([0, 0, 0], .28));
  inside.addColorStop(along(pole * 1.04), 'rgba(0,0,0,0)');
  inside.addColorStop(1, 'rgba(0,0,0,0)');
  lc.save();
  lc.globalCompositeOperation = 'destination-out';
  lc.fillStyle = inside;
  lc.beginPath();
  lc.arc(ox, oy, R, 0, TAU);
  lc.fill();
  lc.restore();
  // the glow: the dots again, in their colors, at half size into the light canvas; the bloom softens them and the rays
  // carry their colors out
  const glowUp = () => {
    const lw = Math.ceil(W / 2), lh = Math.ceil(H / 2);
    if (LIGHT_SRC.width !== lw || LIGHT_SRC.height !== lh) {
      LIGHT_SRC.width = lw;
      LIGHT_SRC.height = lh;
    }
    lsc.setTransform(1, 0, 0, 1, 0, 0);
    lsc.globalCompositeOperation = 'source-over';
    lsc.globalAlpha = 1;
    lsc.fillStyle = '#000';
    lsc.fillRect(0, 0, lw, lh);
    lsc.setTransform(.5, 0, 0, .5, 0, 0);
    lsc.globalCompositeOperation = 'lighter';
    for (const it of placed) {
      if (it.bright < .01) continue;
      lsc.globalAlpha = it.bright * (.4 + .3 * it.on);
      lsc.fillStyle = rgba(it.col, 1);
      lsc.beginPath();
      lsc.arc(it.X, it.Y, it.r * (1.3 + .6 * it.on), 0, TAU);
      lsc.fill();
    }
    lsc.globalAlpha = 1;
    lightUp();
  };
  shine(false);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.drawImage(LINE_LAYER, 0, 0);
  // a little gold light at the heart of the line's light, laid along it, on top of the dimming so it shows
  g.translate(ox, oy);
  g.rotate(ROLL);
  g.scale(Math.cos(YAW) * SPEAR * 1.6, .45);
  const heart = g.createRadialGradient(0, 0, 0, 0, 0, R * .32);
  heart.addColorStop(0, `rgba(255, 200, 120, ${(.32 + .15 * rise).toFixed(3)})`);
  heart.addColorStop(.45, 'rgba(255, 190, 110, .11)');
  heart.addColorStop(1, 'rgba(255, 190, 110, 0)');
  g.fillStyle = heart;
  g.beginPath();
  g.arc(0, 0, R * .32, 0, TAU);
  g.fill();
  g.restore();
  shine(true);
  glowUp();
  liquidGlass(t);
  requestAnimationFrame(frame);
}

function setModel(m) {
  model = m;
  goalColor = hex(MODELS[m].color);
  $('model').textContent = MODELS[m].name;
  $('role').innerHTML = MODELS[m].role;
  mark();
}
function setState(s) { state = s; goal = { ...STATES[s] }; mark(); }

// the reply comes in a sentence at a time, each fading in quickly; a full stop only ends a sentence before a space
// or the end, so "pins.h" stays whole. Each sentence is metal on its own
function say(html, reveal = !REDUCE) {
  const parts = html.match(/.+?[.!?](?=\s|$)\s*|.+$/g) || [];
  $('say').innerHTML = parts.map((s, i) => reveal
    ? `<span class="metal arrive" style="animation-delay:${(i * .38).toFixed(2)}s">${s}</span>`
    : `<span class="metal">${s}</span>`).join('');
}
function you(text) { $('you').textContent = text ? `“${text}”` : ''; }
// the call bar. Each dot is a tiny orb in that model's colors as the orb shows them: deep blue in the middle, then
// violet, the model's color, and its contrast color at the rim (so Spark reads violet-blue, as on the orb, not pink).
// A model's entry comes in the moment it starts working, its dot breathing, and its time fills in when it's done, so
// the newest dot is always the model the orb is showing
function dotFor(m) {
  const c = hex(MODELS[m].color), green = m === 'open' ? 1 : 0, blue = mix(NAVY_RGB, GREEN, .45 * green);
  const stops = [[mix(blue, [4, 6, 20], .45), 0], [mix(blue, c, .5), 42], [c, 74], [mix(contrastOf(c), GREEN, green), 100]];
  return `background:radial-gradient(circle, ${stops.map(([s, at]) => `${rgba(s, 1)} ${at}%`).join(', ')});box-shadow:0 0 7px ${rgba(mix(blue, c, .5), .6)}`;
}
function begin(m) {
  const el = document.createElement('span');
  el.className = 'pending';
  el.dataset.model = m;
  el.innerHTML = `<i style="${dotFor(m)}"></i>${MODELS[m].short} …`;
  $('calls').append(el);
}
function call(m, seconds) {
  const el = [...$('calls').querySelectorAll('span.pending')].filter(s => s.dataset.model === m).pop() || $('calls').appendChild(document.createElement('span'));
  el.className = '';
  el.innerHTML = `<i style="${dotFor(m)}"></i>${MODELS[m].short} ${seconds.toFixed(1)} s`;
}
function total(text) {
  const el = document.createElement('span');
  el.textContent = text;
  el.style.color = 'var(--ink)';
  $('calls').append(el);
}

// Act 1's beats with made-up times, to see the transitions
const ACT1 = [
  [0, () => { $('calls').innerHTML = ''; setModel('transcribe'); begin('transcribe'); setState('listening');
              you('Copilot, the sensor doesn’t answer a press.'); say('', false); }],
  [3.6, () => { call('transcribe', 0.7); setModel('spark'); begin('spark'); setState('thinking'); say('Reading the sensor.'); }],
  [6.4, () => { call('spark', 1.3); setModel('sam'); begin('sam'); say('It reads flat. Looking at the board.'); }],
  [9.8, () => { call('sam', 4.1); setModel('wonder'); begin('wonder'); say('It’s wired to GPIO 4, but pins.h says 15. Writing the fix.'); }],
  [13.6, () => { call('wonder', 6.2); setModel('spark'); begin('spark'); setState('speaking');
                 say('Fix staged. <b>Your turn:</b> flash the board.'); }],
  [16.8, () => setState('idle')],
  [19.5, () => { call('spark', 0.9); you(''); setState('speaking'); say('Fixed. It answers your press now.'); }],
  [22.5, () => { setState('idle'); total('Act 1 · 21 s · $0.03'); }],
];
let timers = [];
function playAct1() { timers.forEach(clearTimeout); timers = ACT1.map(([s, fn]) => setTimeout(fn, s * 1000)); }

const panel = $('panel');
let camTried = false;
async function toggleCam() {
  panel.classList.toggle('open');
  if (camTried || !panel.classList.contains('open')) return;
  camTried = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const v = document.createElement('video');
    v.autoplay = v.muted = v.playsInline = true;
    v.srcObject = stream;
    panel.textContent = '';
    panel.append(v);
  } catch {
    panel.textContent = 'Camera feed (no camera access here)';
  }
}
$('cam').onclick = toggleCam;

async function useMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(), an = ac.createAnalyser();
    an.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(an);
    mic = { an, buf: new Uint8Array(an.fftSize) };
    setState('listening');
  } catch {}
}

const dev = $('dev');
function button(label, fn, key = '') {
  const b = document.createElement('button');
  b.className = 'glass';
  b.textContent = label;
  b.dataset.key = key;
  b.onclick = fn;
  dev.append(b);
}
const gap = () => dev.append(Object.assign(document.createElement('span'), { className: 'gap' }));
for (const s of Object.keys(STATES)) button(s, () => setState(s), 's:' + s);
gap();
for (const m of Object.keys(MODELS)) button(m === 'open' ? 'Spark Open (Baseten)' : MODELS[m].short, () => setModel(m), 'm:' + m);
gap();
button('Play Act 1 (A)', playAct1);
button('Mic', useMic);
button('Hide (H)', () => document.body.classList.add('clean'));
function mark() {
  const on = ['s:' + state, 'm:' + model];
  for (const b of dev.querySelectorAll('button')) b.classList.toggle('on', on.includes(b.dataset.key));
}
addEventListener('keydown', e => {
  if (e.target.closest('#ask')) return;
  if (e.key === 'h') document.body.classList.toggle('clean');
  if (e.key === 'a') playAct1();
  if (e.key === 'c') toggleCam();
});

// the typed way in: the text, or the added file's name, shows as the request, then a stand-in reply. Live, it doesn't
// reach the copilot yet, so it does nothing rather than show a made-up reply
let attached = null;
$('file').addEventListener('change', e => {
  attached = e.target.files[0] || null;
  $('chip').textContent = attached ? attached.name : '';
  $('chip').hidden = !attached;
});
$('ask').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (LIVE || (!text && !attached)) return;
  timers.forEach(clearTimeout);
  $('calls').innerHTML = '';
  you(text || attached.name);
  $('text').value = '';
  $('file').value = '';
  attached = null;
  $('chip').hidden = true;
  setModel('spark');
  begin('spark');
  setState('thinking');
  say('Reading it.');
  timers = [setTimeout(() => { call('spark', 1.1); setState('speaking'); say('Here’s where the reply goes.'); }, 2200),
            setTimeout(() => setState('idle'), 5200)];
});

// start settled in the sea
for (const d of DOTS) d.at = PLACE.sea(d);
setModel('spark');
setState('idle');
say('Say “Copilot” to start.', false);
requestAnimationFrame(frame);
// live, each event from the copilot is [function, ...arguments] for one of the functions above, or clear, which empties
// the call bar for a new turn. On its own, the page plays the mocked Act 1
if (LIVE) {
  const live = { setState, setModel, you, say, begin, call, total, clear: () => { $('calls').innerHTML = ''; } };
  new EventSource('events').onmessage = e => { const [fn, ...args] = JSON.parse(e.data); live[fn]?.(...args); };
} else setTimeout(playAct1, 1500);
</script>
