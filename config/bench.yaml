# This bench: the camera, the printed carrier the breadboard lies on, and where each part sits.
# Positions are in mm on the carrier, from the paper's top-left corner, x to the right and y down.

camera: {index: 1, width: 1920, height: 1080}  # index 0 is the desk camera (config/desk.yaml)
schematic: hardware/demo_led.kicad_sch  # the design (read_schematic); scripts/make_schematic.py draws it

carrier:                            # printed by scripts/make_carrier.py: print at 100% ("Actual size")
  paper_mm: [279.4, 215.9]          # US Letter, landscape
  tag_family: tag36h11
  tag_size_mm: 20                   # the black square's edge
  tags: {10: [40.0, 62.0], 11: [239.4, 62.0], 12: [239.4, 153.9], 13: [40.0, 153.9]}   # tag centers
  board_top_mm: 10                  # how far the breadboards' tops stand above the sheet: the arm's touch test aims at
                                    # holes there, and register_arm.py verify measures it

boards:
  # Each breadboard's hole a1 on the carrier, the way its row numbers grow, and the way its letters run
  # from a to j. This one is centered on the sheet, with row 1 at the sheet's left and column a along its
  # bottom edge, where the sheet says "column a side".
  main: {a1_mm: [60.96, 121.92], rows_toward: [1, 0], letters_toward: [0, -1]}

reader:
  px_per_mm: 5.5                    # the top-down board view SAM sees; the open SAM 3 works at 1008 px
  margin_mm: 7                      # around the boards' bodies, which look up to 6% larger (register_scale)
  wire_phrase: wire                 # SAM 3.1 finds every wire as "wire", and nothing as "jumper wire"
  snap_mm: 1.3                      # a wire end farther than this from every hole is flagged: ends can read
                                    # 1.27 mm from their right holes
  # From the end of a wire's mask back to its hole. Negative: the hole lies beyond the mask, because SAM's mask
  # stops where the insulation does and the bare leg goes on about 1 mm.
  tip_inset_mm: -1.0
  register_mm: 1.2                  # how far a board may sit from its printed outline (under half a pitch)
  register_deg: 1.0
  # The board's top is about 10 mm above the sheet, so it looks larger than life, about 1.02 from the C920
  # above it. A printer that didn't print at exactly 100% adds its own error.
  register_scale: [0.97, 1.06]

# Which hole each module's headers start in, and which way along the rows they run (+1 or -1).
# The reader traces every wire either way, but checks the wiring against pins.h only once the modules
# its signals name are placed.
modules:
  # The demo board's DevKit: antenna end at row 15, USB end at row 1. Its pin rows are 1.0" apart,
  # in columns b and j, so only column a is left free beside a header. The header with the LED's pin
  # (D23 to 3V3) is the b side: D23 beside a15, 3V3 beside a1.
  esp32: {part: esp32_devkit_30, headers: {left: {start: j15, step: -1}, right: {start: b15, step: -1}}}
  # The Act 1 LED: its jumper runs along column a from a5 (GPIO 4) to a26, a resistor goes from b26 to b42, the
  # LED's anode is in row 42 and its cathode in row 43, and a jumper takes row 43 to a rail. SAM reads the
  # long-legged resistor as a wire, which joins the nets.
  led: {part: led_5mm, headers: {legs: {start: e42, step: 1}}}

firmware:
  file: firmware/dut_demo/include/pins.h
  gpio_module: esp32                # its GPIOn pins are what the numbers in pins.h name
  signals: {LED_PIN: led.A}
  # The demo board's USB serial port, for read_sensor and build_and_flash. "auto" picks the one USB serial
  # port that isn't the arm's; set a path when more than one ESP32 is plugged in.
  port: auto
  skip_ports: [/dev/cu.usbmodem5B910297421]
  baud: 115200
  upload_cmd: pio run -d firmware/dut_demo -t upload --upload-port {port}
